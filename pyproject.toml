[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sdss-spectral-anomalies"
version = "0.1.0"
description = "Anomaly detection in SDSS stellar spectra"
requires-python = ">=3.12"
dependencies = [
    "astroquery>=0.4",
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "streamlit>=1.30",
    "plotly>=5.18",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.0",
    "ruff>=0.2",
]

[project.scripts]
sdss-anomalies = "src.run_pipeline:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100

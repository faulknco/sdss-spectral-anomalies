[project]
name = "sdss-spectral-anomalies"
version = "0.1.0"
description = "Anomaly detection in SDSS stellar spectra"
requires-python = ">=3.12"
dependencies = [
    "astroquery>=0.4",
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "streamlit>=1.30",
    "plotly>=5.18",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.2",
]

[tool.ruff]
line-length = 100
